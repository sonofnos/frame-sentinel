[package]
name = "frame-sentinel"
version = "0.1.0"
edition = "2021"
description = "Static analyzer for Polkadot SDK FRAME pallets: runtime panics, unchecked arithmetic, unbounded storage and iteration, missing origin checks, zero weights."
license = "Apache-2.0"
authors = ["Christian Emeka <christian@sonofnos.com>"]
repository = "https://github.com/sonofnos/frame-sentinel"
rust-version = "1.75"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
